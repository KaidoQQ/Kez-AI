name: Tests

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Настоящий PostgreSQL 16 для тестов БД (tests/test_database.py)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kez_test
          POSTGRES_USER: kez_user
          POSTGRES_PASSWORD: kez_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kez_user -d kez_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kez_user:kez_password@localhost:5432/kez_test
      # Тесты не обращаются к Gemini, ключ нужен только чтобы модули импортировались
      GEMINI_API_KEY: ci-dummy-key
      # Qt без экрана
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system libraries for PyQt6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libglib2.0-0 libpulse0 fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -v --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
