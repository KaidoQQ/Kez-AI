services:
  db:
    image: postgres:16-alpine
    container_name: kez-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kez_db}
      POSTGRES_USER: ${POSTGRES_USER:-kez_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kez_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kez_user} -d ${POSTGRES_DB:-kez_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kez-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kez_user}:${POSTGRES_PASSWORD:-kez_password}@db:5432/${POSTGRES_DB:-kez_db}
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    network_mode: bridge

volumes:
  postgres_data:
